# =============================================================================
# config.properties — Common properties for ALL environments
# No secrets or environment-specific values here.
# =============================================================================

# Application Details (resolved from pom.xml via Maven resource filtering)
app.name=${app.name}
app.version=${app.version}

# HTTP Listener Details
http.host=0.0.0.0
http.port=8081
http.timeout=30000
http.idleTimeout=40000
http.basePath=/api/*

# Retry Settings (Salesforce until-successful)
retry.attempts=3
retry.interval=1000

# Request Timeout
request.timeout=10000
request.idleTimeout=30000

# Reconnection Strategy (Salesforce JWT connector)
reconnection.frequency=2000
reconnection.attempts=3

# Salesforce Transient Errors (trigger until-successful retry)
sfdcTransientErrors=SALESFORCE:CONNECTIVITY,SALESFORCE:UNAVAILABLE,SALESFORCE:TIMEOUT

# Propagate HTTP Errors
httpErrors=HTTP:CONNECTIVITY,HTTP:INTERNAL_SERVER_ERROR,HTTP:RETRY_EXHAUSTED,HTTP:SERVICE_UNAVAILABLE,HTTP:TIMEOUT

# Timezone for timestamps in liveness/readiness responses
timezone=EST

# Source and Target System (used in all log entries)
sourceSystem=sf-http-sys-api-template
targetSystem=Salesforce

# Health/Alive Endpoint Messages
message.systemsNotReady=Target System(s) not ready
message.systemsReady=ready
message.systemsAlive=alive
message.systemUp=up
message.systemDown=down

# Salesforce Configuration Defaults
sfl.objectTtl=30
sfl.maxEntries=10
sfl.responseTimeout=30000

# Salesforce sObject API Names
# Replace SObjectName__c with the actual sObject API name for your implementation
sfl.sfObjectName=SObjectName__c
sf.createIntegrationError=Integration_Error__c

# SOQL base query for GET /records (appended with dynamic WHERE clauses in p-get-records-query.dwl)
# Replace with the actual SELECT fields and FROM clause for your sObject
sfl.getRecordsQuery=SELECT Id, Name, ExternalId__c, Status__c FROM SObjectName__c WHERE IsDeleted = false

# RecordType sObjects (comma-separated — used in p-set-record-type-query.dwl)
# Include only the sObjects that use RecordTypes in your implementation
recordtype.sobjects=SObjectName

# ObjectStore Config (in days)
os.objectTtl=30
os.expirationInterval=1

# ObjectStore RecordType cache keys (SobjectType|RecordType Name)
# Add one entry per RecordType used; format: os.recordTypeId.<SObjectType>=<SObjectType>|<RecordTypeDeveloperName>
os.recordTypeId.SObjectName=SObjectName|RecordTypeName

# Logger Details
logger.sensitiveFields=name,email,mail,phone,mobile,ssn,sin,dob,birth,address,street,city,state,zip,postal,account,iban,routing,bank,card,cvv,userid,username,customerid,clientid,token,secret,password,authorization,cookie,apikey,key,price
logger.safeKeys=requestid,traceid,correlationid,transactionid,messageid,eventid
