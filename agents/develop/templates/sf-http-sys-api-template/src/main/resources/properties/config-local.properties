## Local usage — append to VM arguments:
##   -M-Dmule.env=local -M-Danypoint.platform.gatekeeper=disabled

# Auto Discovery ID (local/dev share the same registration)
api.id=<local-api-id>

# Salesforce — DevINT2 sandbox
# Point to the lowest sandbox (DevINT2) for local development
sfl.keystore=certs/00D<OrgId>.jks
sfl.tokenUrl=https://omnipod--devint2.sandbox.my.salesforce.com/services/oauth2/token
sfl.audienceUrl=https://test.salesforce.com
sfl.consumerkey=${azure-key-vault-properties-provider::secret::na-sfl-<project>-consumer-key}
sfl.principal=${azure-key-vault-properties-provider::secret::na-sfl-<project>-principal}
sfl.storepassword=${azure-key-vault-properties-provider::secret::na-sfl-<project>-storepassword}
sfl.certalias=${azure-key-vault-properties-provider::secret::na-sfl-<project>-certalias}

# Salesforce Composite — DevINT2 sandbox (remove if not using composite connector)
aspn.sfl.keystore=certs/aspn/00D<OrgId>.jks
aspn.sfl.tokenUrl=https://omnipod--devint2.sandbox.my.salesforce.com/services/oauth2/token
aspn.sfl.audienceUrl=https://test.salesforce.com
aspn.sfl.consumerkey=${azure-key-vault-properties-provider::secret::na-sfl-aspn-consumer-key}
aspn.sfl.principal=${azure-key-vault-properties-provider::secret::na-sfl-aspn-principal}
aspn.sfl.storepassword=${azure-key-vault-properties-provider::secret::na-sfl-aspn-storepassword}
aspn.sfl.certalias=${azure-key-vault-properties-provider::secret::na-sfl-aspn-certalias}

# Logger encryption key — always from AKV even locally
logger.encryptionKey=${azure-key-vault-properties-provider::secret::global-logger-encryption-key}
