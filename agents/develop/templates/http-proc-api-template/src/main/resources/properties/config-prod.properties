## Prod usage — append below to VM arguments:
##   -M-Dmule.env=prod -M-Dmule.encryption.key=  -M-Danypoint.platform.gatekeeper=disabled

# Auto Discovery ID
api.id=<replace-with-api-id-from-api-manager>

# Primary downstream SAPI — replace "primary.sapi" with actual prefix
primary.sapi.protocol=HTTPS
primary.sapi.host=prod.na.internal.insuletintegrations.com
primary.sapi.port=443
primary.sapi.basePath=<replace-with-basePath>
primary.sapi.update.record.method=PUT
primary.sapi.update.record.path=/api/v1/providers/records/{id}
primary.sapi.healthCheck.method=GET
primary.sapi.healthCheck.path=/api/v1/health-check
primary.sapi.client_id=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-id}
primary.sapi.client_secret=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-secret}

# Secondary downstream SAPI — replace "secondary.sapi" with actual prefix
secondary.sapi.protocol=HTTPS
secondary.sapi.host=prod.na.internal.insuletintegrations.com
secondary.sapi.port=443
secondary.sapi.basePath=<replace-with-basePath>
secondary.sapi.operation.method=POST
secondary.sapi.operation.path=/api/v1/secondary/items
secondary.sapi.healthCheck.method=GET
secondary.sapi.healthCheck.path=/api/v1/health-check
secondary.sapi.client_id=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-id}
secondary.sapi.client_secret=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-secret}

# Tertiary downstream SAPI — replace "tertiary.sapi" with actual prefix
tertiary.sapi.protocol=HTTPS
tertiary.sapi.host=prod.na.internal.insuletintegrations.com
tertiary.sapi.port=443
tertiary.sapi.basePath=<replace-with-basePath>
tertiary.sapi.operation.method=POST
tertiary.sapi.operation.path=/api/v1/tertiary/items
tertiary.sapi.healthCheck.method=GET
tertiary.sapi.healthCheck.path=/api/v1/health-check
tertiary.sapi.client_id=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-id}
tertiary.sapi.client_secret=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-secret}

# sfl-crm-persona-sys-api (error logging SAPI — always required)
sfl.crm.persona.protocol=HTTPS
sfl.crm.persona.host=prod.na.internal.insuletintegrations.com
sfl.crm.persona.port=443
sfl.crm.persona.basePath=/system/crm/personas/v2
sfl.crm.persona.transactionsErrorsPath=/api/transactions-errors
sfl.crm.persona.healthCheck.method=GET
sfl.crm.persona.healthCheck.path=/api/health-check
sfl-crm-persona-api.client_id=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-id}
sfl-crm-persona-api.client_secret=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-secret}

# Notification API
notification.api.host=prod.na.internal.insuletintegrations.com
notification.api.port=443
notification.api.basePath=/
notification.api.path=/api/v1/notifications
notification.api.clientId=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-id}
notification.api.clientSecret=${azure-key-vault-properties-provider::secret::na-common-mule-internal-client-secret}

# Logger Details
logger.encryptionKey=${azure-key-vault-properties-provider::secret::global-logger-encryption-key}
