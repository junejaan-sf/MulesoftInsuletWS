## Local usage — append below to VM arguments:
##   -M-Dmule.env=local -M-Dmule.encryption.key=  -M-Danypoint.platform.gatekeeper=disabled

# Auto Discovery ID (disable for local)
api.id=local

# Primary downstream SAPI
# Replace "primary.sapi" with your actual SAPI property prefix (e.g., sfl.crm.persona)
primary.sapi.protocol=HTTP
primary.sapi.host=localhost
primary.sapi.port=8082
primary.sapi.basePath=/api/v1
primary.sapi.update.record.method=PUT
primary.sapi.update.record.path=/api/v1/providers/records/{id}
primary.sapi.healthCheck.method=GET
primary.sapi.healthCheck.path=/api/v1/health-check
primary.sapi.client_id=local-client-id
primary.sapi.client_secret=local-client-secret

# Secondary downstream SAPI (scatter-gather Route A)
# Replace "secondary.sapi" with your actual SAPI property prefix
secondary.sapi.protocol=HTTP
secondary.sapi.host=localhost
secondary.sapi.port=8083
secondary.sapi.basePath=/api/v1
secondary.sapi.operation.method=POST
secondary.sapi.operation.path=/api/v1/secondary/items
secondary.sapi.healthCheck.method=GET
secondary.sapi.healthCheck.path=/api/v1/health-check
secondary.sapi.client_id=local-client-id
secondary.sapi.client_secret=local-client-secret

# Tertiary downstream SAPI (scatter-gather Route B)
# Replace "tertiary.sapi" with your actual SAPI property prefix
tertiary.sapi.protocol=HTTP
tertiary.sapi.host=localhost
tertiary.sapi.port=8085
tertiary.sapi.basePath=/api/v1
tertiary.sapi.operation.method=POST
tertiary.sapi.operation.path=/api/v1/tertiary/items
tertiary.sapi.healthCheck.method=GET
tertiary.sapi.healthCheck.path=/api/v1/health-check
tertiary.sapi.client_id=local-client-id
tertiary.sapi.client_secret=local-client-secret

# sfl-crm-persona-sys-api (error logging SAPI — always required)
sfl.crm.persona.protocol=HTTP
sfl.crm.persona.host=localhost
sfl.crm.persona.port=8084
sfl.crm.persona.basePath=/system/crm/personas/v2
sfl.crm.persona.transactionsErrorsPath=/api/transactions-errors
sfl.crm.persona.healthCheck.method=GET
sfl.crm.persona.healthCheck.path=/api/health-check
sfl-crm-persona-api.client_id=local-client-id
sfl-crm-persona-api.client_secret=local-client-secret

# Logger Details
logger.encryptionKey=local-encryption-key-32-chars-xx
