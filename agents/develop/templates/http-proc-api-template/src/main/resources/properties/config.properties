# Application Details
app.name=${app.name}
app.version=${app.version}

# Retry Details Until Successful
# In milliseconds
retry.attempts=3
retry.interval=1000

# Request Timeout Details
# In milliseconds
request.timeout=30000
request.idleTimeout=30000

# HTTP Listener Details
# In milliseconds
http.host=0.0.0.0
http.port=8081
http.timeout=30000
http.idleTimeout=40000
http.basePath=/api/*

# Propagate Errors (retried by until-successful)
httpErrors=HTTP:CONNECTIVITY, HTTP:INTERNAL_SERVER_ERROR, HTTP:RETRY_EXHAUSTED, HTTP:SERVICE_UNAVAILABLE, HTTP:TIMEOUT

# Reconnection Strategy
reconnection.frequency=2000
reconnection.attempts=3

timezone=EST
tier=Process

# Default Source and Target System — override per environment if needed
# Replace {source-system} and {target-system} with actual values (e.g., Drupal, Salesforce)
sourceSystem={source-system}
targetSystem={target-system}

ie.transactionType=Inbound

# Logger Details
logger.sensitiveKeyParts=name,email,mail,phone,mobile,ssn,sin,dob,birth,address,street,city,state,zip,postal,account,iban,routing,bank,card,cvv,userid,username,customerid,clientid,token,secret,password,authorization,cookie,apikey,key
logger.safeKeys=requestid,traceid,correlationid,transactionid,messageid,eventid

# Healthcheck / Alive endpoint messages
message.systemsNotReady=not ready
message.systemsReady=ready
message.systemsAlive=alive
message.systemUp=up
message.systemDown=down

# Resolved Flag for integration error objects
ie.resolvedFlag=false
