# =============================================================================
# config-qa.properties — QA environment
# All credential values use Azure Key Vault placeholders: ${vault::<secret-name>}
# =============================================================================

# --- API Gateway ---
api.id=${vault::mq-proc-api-template-api-id-qa}

# --- HTTP Listener ---
http.port=8081

# --- Anypoint MQ ---
mq.url=https://mq-us-east-1.anypoint.mulesoft.com/api/v1/organizations/{orgId}/environments/{envId}/regions/us-east-1
mq.queueName=qa-mq-proc-api-template-queue
mq.dlq.queueName=qa-mq-proc-api-template-dlq
mq.app.clientId=${vault::mq-proc-api-template-mq-clientid-qa}
mq.app.clientSecret=${vault::mq-proc-api-template-mq-clientsecret-qa}

# --- Circuit Breaker ---
mq.subscriber.circuitBreaker.errorsThreshold=5
mq.subscriber.circuitBreaker.tripTimeout=60000

# --- {downstream-sys-api} ---
{downstream-sys-api}.host={downstream-sys-api}-qa.insulet.com
{downstream-sys-api}.port=443
{downstream-sys-api}.protocol=HTTPS
{downstream-sys-api}.basePath=/api/v1
{downstream-sys-api}.client_id=${vault::mq-proc-api-template-downstream-clientid-qa}
{downstream-sys-api}.client_secret=${vault::mq-proc-api-template-downstream-clientsecret-qa}

# --- sfl-crm-persona-sys-api ---
sfl-crm-persona-sys-api.host=sfl-crm-persona-sys-api-qa.insulet.com
sfl-crm-persona-sys-api.port=443
sfl-crm-persona-sys-api.protocol=HTTPS
sfl-crm-persona-sys-api.basePath=/api/v1
sfl-crm-persona-sys-api.client_id=${vault::mq-proc-api-template-persona-clientid-qa}
sfl-crm-persona-sys-api.client_secret=${vault::mq-proc-api-template-persona-clientsecret-qa}

# --- Logger ---
logger.encryptionKey=${vault::mq-proc-api-template-logger-encryptionkey-qa}

# --- Notification ---
notification.api.clientId=${vault::mq-proc-api-template-notification-clientid-qa}
notification.api.clientSecret=${vault::mq-proc-api-template-notification-clientsecret-qa}
