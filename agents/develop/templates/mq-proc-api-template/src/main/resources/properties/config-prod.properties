# =============================================================================
# config-prod.properties — PROD environment
# All credential values use Azure Key Vault placeholders: ${vault::<secret-name>}
# IMPORTANT: log4j2.xml for PROD must set all AsyncLogger categories to WARN.
# =============================================================================

# --- API Gateway ---
api.id=${vault::mq-proc-api-template-api-id-prod}

# --- HTTP Listener ---
http.port=8081

# --- Anypoint MQ ---
mq.url=https://mq-us-east-1.anypoint.mulesoft.com/api/v1/organizations/{orgId}/environments/{envId}/regions/us-east-1
mq.queueName=prod-mq-proc-api-template-queue
mq.dlq.queueName=prod-mq-proc-api-template-dlq
mq.app.clientId=${vault::mq-proc-api-template-mq-clientid-prod}
mq.app.clientSecret=${vault::mq-proc-api-template-mq-clientsecret-prod}

# --- Circuit Breaker ---
mq.subscriber.circuitBreaker.errorsThreshold=5
mq.subscriber.circuitBreaker.tripTimeout=120000

# --- {downstream-sys-api} ---
{downstream-sys-api}.host={downstream-sys-api}.insulet.com
{downstream-sys-api}.port=443
{downstream-sys-api}.protocol=HTTPS
{downstream-sys-api}.basePath=/api/v1
{downstream-sys-api}.client_id=${vault::mq-proc-api-template-downstream-clientid-prod}
{downstream-sys-api}.client_secret=${vault::mq-proc-api-template-downstream-clientsecret-prod}

# --- sfl-crm-persona-sys-api ---
sfl-crm-persona-sys-api.host=sfl-crm-persona-sys-api.insulet.com
sfl-crm-persona-sys-api.port=443
sfl-crm-persona-sys-api.protocol=HTTPS
sfl-crm-persona-sys-api.basePath=/api/v1
sfl-crm-persona-sys-api.client_id=${vault::mq-proc-api-template-persona-clientid-prod}
sfl-crm-persona-sys-api.client_secret=${vault::mq-proc-api-template-persona-clientsecret-prod}

# --- Logger ---
logger.encryptionKey=${vault::mq-proc-api-template-logger-encryptionkey-prod}

# --- Notification ---
notification.api.clientId=${vault::mq-proc-api-template-notification-clientid-prod}
notification.api.clientSecret=${vault::mq-proc-api-template-notification-clientsecret-prod}
