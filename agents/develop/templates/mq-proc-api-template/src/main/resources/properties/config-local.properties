# =============================================================================
# config-local.properties — Local developer environment
# Credentials may be hardcoded for local testing ONLY.
# NEVER commit real credentials — use placeholders or local AKV emulator.
# =============================================================================

# --- API Gateway ---
api.id=00000000

# --- HTTP Listener (override for local port) ---
http.port=8081

# --- Anypoint MQ ---
mq.url=https://mq-us-east-1.anypoint.mulesoft.com/api/v1/organizations/{orgId}/environments/{envId}/regions/us-east-1
mq.queueName=local-mq-proc-api-template-queue
mq.dlq.queueName=local-mq-proc-api-template-dlq
mq.app.clientId=<local-mq-client-id>
mq.app.clientSecret=<local-mq-client-secret>

# --- Circuit Breaker ---
mq.subscriber.circuitBreaker.errorsThreshold=3
mq.subscriber.circuitBreaker.tripTimeout=30000

# --- {downstream-sys-api} ---
{downstream-sys-api}.host=localhost
{downstream-sys-api}.port=8082
{downstream-sys-api}.protocol=HTTP
{downstream-sys-api}.basePath=/api/v1
{downstream-sys-api}.client_id=<local-downstream-client-id>
{downstream-sys-api}.client_secret=<local-downstream-client-secret>

# --- sfl-crm-persona-sys-api ---
sfl-crm-persona-sys-api.host=localhost
sfl-crm-persona-sys-api.port=8083
sfl-crm-persona-sys-api.protocol=HTTP
sfl-crm-persona-sys-api.basePath=/api/v1
sfl-crm-persona-sys-api.client_id=<local-persona-client-id>
sfl-crm-persona-sys-api.client_secret=<local-persona-client-secret>

# --- Logger ---
logger.encryptionKey=<local-logger-encryption-key>

# --- Notification ---
notification.api.clientId=<local-notification-client-id>
notification.api.clientSecret=<local-notification-client-secret>
