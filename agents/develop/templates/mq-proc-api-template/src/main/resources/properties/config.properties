# =============================================================================
# config.properties — Common / non-environment-specific properties
# All environment-specific values go in config-{env}.properties
# Sensitive values (credentials, keys) MUST NOT appear here — use AKV
# =============================================================================

# --- Application Details (resolved from Maven at build time) ---
app.name=${app.name}
app.version=${app.version}

# --- API Identity ---
sourceSystem=mq-proc-api-template
targetSystem={downstream-sys-api}
timezone=EST

# --- HTTP Listener ---
http.host=0.0.0.0
http.basePath=/api/v1/*
http.apiVersion=v1
http.timeout=30000
http.idleTimeout=60000

# --- Outbound HTTP Request ---
# Timeout for all outbound HTTP requests (ms)
request.timeout=30000
request.idleTimeout=30000

# --- Retry ---
retry.attempts=3
retry.interval=3000

# --- HTTP Error Types for until-successful retry ---
# Comma-separated list of error types that trigger retry in common-connectivity flows
httpErrors=HTTP:TIMEOUT,HTTP:CONNECTIVITY,HTTP:SERVICE_UNAVAILABLE

# --- Anypoint MQ ---
mq.connectionTimeout=30000
mq.reconnection.frequency=10000
mq.reconnection.attempts=3
mq.maxLocalMessages=1

# --- MQ Circuit Breaker ---
# Error types that trip the circuit breaker (propagated to queue for redelivery)
mq.subscriber.circuitBreakerErrors=APP:CONNECTIVITY_FAILED,HTTP:CONNECTIVITY,HTTP:TIMEOUT,HTTP:SERVICE_UNAVAILABLE

# --- Transaction Error / Delivery Count DLQ Routing ---
# Number of redeliveries before a message is routed to integration error log / DLQ
mq.transactionErrors.deliveryCountThreshold=5

# DLQ fallback — when true, failed messages are also published to the DLQ queue
transaction-errors.fallback.dlq.enabled=false

# --- Integration Error Resolved Flag ---
# Salesforce integration error resolved status on creation (always false)
ie.resolvedStatus=false

# --- Logger ---
logger.sensitiveFields=password,secret,token,authorization,client_secret,clientSecret,apiKey,api_key
logger.safeKeys=correlationId,transactionId,messageId,sourceSystem,targetSystem,status

# --- Health Check / Liveness / Readiness messages ---
message.systemsNotReady=Target System(s) not ready
message.systemsReady=ready
message.systemsAlive=alive
message.systemUp=up
message.systemDown=down

# --- {downstream-sys-api} static properties ---
# Host, basePath and port are env-specific — see config-{env}.properties
{downstream-sys-api}.name={downstream-sys-api}
{downstream-sys-api}.request.method=POST
{downstream-sys-api}.request.path=/api/v1/records
{downstream-sys-api}.healthCheck.method=GET
{downstream-sys-api}.healthCheck.path=/api/v1/ping

# --- sfl-crm-persona-sys-api static properties ---
sfl-crm-persona-sys-api.name=sfl-crm-persona-sys-api
sfl-crm-persona-sys-api.transactionErrors.method=POST
sfl-crm-persona-sys-api.transactionErrors.path=/api/v1/transaction-errors
sfl-crm-persona-sys-api.healthCheck.method=GET
sfl-crm-persona-sys-api.healthCheck.path=/api/v1/ping

# --- Notification ---
notification.recipient.email=team-distribution-list@insulet.com
