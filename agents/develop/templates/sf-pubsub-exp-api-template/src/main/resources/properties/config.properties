# Application Details
app.name=${app.name}
app.version=${app.version}

# Source and Target System
sourceSystem=Salesforce
targetSystem=<replace-with-target-system>

# Retry Details
retry.attempts=3
retry.interval=1000

# Request Timeout Details
request.timeout=30000
request.idleTimeout=30000

# Logger Details
logger.sensitiveKeyParts=ssn,password,secret,token,email,creditCard,accountNumber,client_secret,clientSecret
logger.safeKeys=correlationId,transactionId,x-correlation-id

# HTTP Listener Details
http.port=8081
http.basePath=/api/v1/*
http.timeout=30000
http.idleTimeout=40000

# Propagate Errors
httpErrors=HTTP:CONNECTIVITY, HTTP:INTERNAL_SERVER_ERROR, HTTP:RETRY_EXHAUSTED, HTTP:SERVICE_UNAVAILABLE, HTTP:TIMEOUT

# Timezone
timezone=EST

# Reconnection Strategy (used by Pattern B — Replay Channel Listener / Salesforce SFDC config)
reconnection.frequency=1000
reconnection.attempts=3

# Health-Check / Alive Endpoint Details
message.systemAlive=alive
message.systemsReady=ready
message.systemsNotReady=Not Ready
message.systemDown=down

# -----------------------------------------------------------------------
# PATTERN A: Subscribe Channel Listener (Salesforce PubSub / gRPC)
# Connector: mule4-salesforce-pubsub-connector:1.2.0
# -----------------------------------------------------------------------
# Salesforce channel name e.g. /event/DoubleOptIn_Event__e or /event/ASPN_Integration__e
sfl.channelName=/event/<replace-with-event-name>

# PubSub gRPC endpoint (do not change unless Salesforce changes the endpoint)
sfl.pubsub.grpc.host=api.pubsub.salesforce.com
sfl.pubsub.grpc.port=7443
sfl.pubsub.publishRequestTimeout=0
sfl.pubsub.reconnection.frequency=2000
sfl.pubsub.reconnection.attempts=2
sfl.pubSub.batchSize=100

# Object Store settings for replayId persistence (Pattern A only)
sfl.pubSub.os.name=pub-sub-object-store_config
sfl.pubSub.os.key=replayId
sfl.pubSub.os.entryTtl=0
sfl.pubSub.os.expirationInterval=1
sfl.pubSub.os.keyDefaultValue=0

# -----------------------------------------------------------------------
# PATTERN B: Replay Channel Listener (Salesforce Streaming / CometD)
# Connector: mule-salesforce-connector (classic)
# -----------------------------------------------------------------------
# Salesforce streaming channel e.g. /event/ASPN_Integration__e
sfl.streamingChannel=/event/<replace-with-streaming-channel-name>

# -----------------------------------------------------------------------
# Anypoint MQ Details (shared by both patterns)
# -----------------------------------------------------------------------
mq.region=us-east-1
mq.url=https://mq-${mq.region}.anypoint.mulesoft.com/api/v1/organizations/${project.groupId}/environments/${mq.environmentId}

# Response Message
message.successfulAcknowledgement=Message published to queue successfully
